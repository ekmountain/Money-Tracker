{% extends 'base.html' %}

{% block title %}Edit Account - Money Tracker{% endblock %}

{% block content %}
    <h2>Edit Account - {{ account.name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Account</button>
        <a href="{% url 'account_list' %}">Cancel</a>
    </form>
{% endblock %}
