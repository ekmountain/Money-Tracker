{% extends 'base.html' %}

{% block title %}Edit Category - Money Tracker{% endblock %}

{% block content %}
    <h2>Edit Category - {{ category.name }}</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Category</button>
        <a href="{% url 'category_list' %}">Cancel</a>
    </form>
{% endblock %}
