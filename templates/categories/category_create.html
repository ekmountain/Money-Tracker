{% extends 'base.html' %}

{% block title %}Add Category - Money Tracker{% endblock %}

{% block content %}
    <h2>Add Custom Category</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Category</button>
        <a href="{% url 'category_list' %}">Cancel</a>
    </form>
{% endblock %}
